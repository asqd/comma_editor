[workspace]
resolver = "3"
members = [
    "core/comma-core",
    "core/comma-ffi",
    "core/comma-cli",
    "core/uniffi-bindgen-swift",
]

[workspace.package]
version = "0.29.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
calamine = { version = "0.36", default-features = false }
cfb = "0.15"
comma-core = { path = "core/comma-core" }
encoding_rs = "0.8.42"
memchr = "2.8"
memmap2 = "0.9"
quick-xml = "0.42"
rayon = "1.10"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = { version = "0.99", default-features = false }
thiserror = "2"
uniffi = "0.32"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
debug = false
lto = "thin"
strip = "debuginfo"
