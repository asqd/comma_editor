[package]
name = "comma-desktop"
description = "CommaEditor for Windows, Linux and macOS: a Tauri shell over comma-ffi."
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
default-run = "comma-desktop"

[lib]
name = "comma_desktop"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[features]
# The development bridge: the commands over HTTP, to run the interface in a browser.
bridge = ["dep:tiny_http"]

[[bin]]
name = "comma-bridge"
path = "src/bin/bridge.rs"
required-features = ["bridge"]

[dependencies]
comma-ffi = { path = "../../../core/comma-ffi", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = { version = "0.12.0", optional = true }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"

[profile.release]
debug = false
lto = "thin"
strip = "debuginfo"

# Its own workspace: the core builds and tests without the WebView libraries Tauri needs.
[workspace]
