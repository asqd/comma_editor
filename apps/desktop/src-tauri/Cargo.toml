[package]
name = "comma-desktop"
description = "CommaEditor for Windows, Linux and macOS: a Tauri shell over comma-ffi."
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "comma_desktop"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
comma-ffi = { path = "../../../core/comma-ffi" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"

[profile.release]
debug = false
lto = "thin"
strip = "debuginfo"

# Its own workspace: the core builds and tests without the WebView libraries Tauri needs.
[workspace]
