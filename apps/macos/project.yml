# XcodeGen spec: `make xcodeproj` (or `xcodegen generate` here) writes CommaEditor.xcodeproj.
name: CommaEditor
options:
  bundleIdPrefix: app.commaeditor
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # The pre-build phase runs cargo from the repository.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CommaEditor:
    type: application
    platform: macOS
    sources:
      - path: CommaEditor
      - path: CommaCore/Sources
        group: CommaCore
    preBuildScripts:
      - name: Build Rust core
        script: '"$SRCROOT/../../scripts/build-core.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: CommaEditor
        PRODUCT_BUNDLE_IDENTIFIER: app.commaeditor.CommaEditor
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/CommaCore/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/CommaCore/lib
        OTHER_LDFLAGS: -lcomma_ffi
    info:
      path: CommaEditor/Info.plist
      properties:
        CFBundleDisplayName: CommaEditor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 CommaEditor"
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: CSV Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).CSVDocument
          - CFBundleTypeName: TSV Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.tab-separated-values-text
              - public.utf8-tab-separated-values-text
            NSDocumentClass: $(PRODUCT_MODULE_NAME).CSVDocument
          - CFBundleTypeName: Excel Workbook
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.spreadsheetml.sheet
              - org.openxmlformats.spreadsheetml.sheet.macroenabled
            NSDocumentClass: $(PRODUCT_MODULE_NAME).WorkbookDocument
          # Excel 97–2003 workbooks are read, not saved.
          - CFBundleTypeName: Excel 97-2003 Workbook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.microsoft.excel.xls
            NSDocumentClass: $(PRODUCT_MODULE_NAME).WorkbookDocument
    entitlements:
      path: CommaEditor/CommaEditor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    dependencies:
      - target: CommaQuickLook

  # Quick Look preview in Finder, embedded in the app. It links the same Rust core; it builds
  # before the app, so it builds the core too (a no-op the second time).
  CommaQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
      - path: CommaCore/Sources
        group: CommaCore
    preBuildScripts:
      - name: Build Rust core
        script: '"$SRCROOT/../../scripts/build-core.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: CommaQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: app.commaeditor.CommaEditor.QuickLook
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/CommaCore/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/CommaCore/lib
        OTHER_LDFLAGS: -lcomma_ffi
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: CommaEditor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        NSHumanReadableCopyright: "© 2026 CommaEditor"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - public.comma-separated-values-text
              - public.tab-separated-values-text
              - public.utf8-tab-separated-values-text
              - public.delimited-values-text
    entitlements:
      path: QuickLook/QuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
