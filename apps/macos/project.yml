# XcodeGen spec: `make xcodeproj` (or `xcodegen generate` here) writes CommaEditor.xcodeproj.
name: CommaEditor
options:
  bundleIdPrefix: app.commaeditor
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # The Rust core is built for Apple Silicon only for now.
    ARCHS: arm64
    # The pre-build phase runs cargo from the repository.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CommaEditor:
    type: application
    platform: macOS
    sources:
      - path: CommaEditor
      - path: CommaCore/Sources
        group: CommaCore
    preBuildScripts:
      - name: Build Rust core
        script: '"$SRCROOT/../../scripts/build-core.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: CommaEditor
        PRODUCT_BUNDLE_IDENTIFIER: app.commaeditor.CommaEditor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/CommaCore/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/CommaCore/lib
        OTHER_LDFLAGS: -lcomma_ffi
    info:
      path: CommaEditor/Info.plist
      properties:
        CFBundleDisplayName: CommaEditor
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: CSV Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).CSVDocument
          - CFBundleTypeName: TSV Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.tab-separated-values-text
              - public.utf8-tab-separated-values-text
            NSDocumentClass: $(PRODUCT_MODULE_NAME).CSVDocument
    entitlements:
      path: CommaEditor/CommaEditor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
