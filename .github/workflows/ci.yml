name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Windows runners check out with core.autocrlf; the samples must keep their bytes anyway.
      - name: Samples checked out as committed
        shell: bash
        run: |
          git ls-files --eol samples core/comma-core/tests/fixtures | awk '
            { if (substr($1, 3) != substr($2, 3)) { print "line endings changed: " $NF; bad = 1 } }
            END { exit bad }'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Round-trip of the samples
        shell: bash
        run: cargo run -q -p comma-cli -- check samples/*.csv
