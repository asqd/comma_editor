name: Release

# The installers of the desktop app on Tauri, for every system: a universal DMG of CommaEditor W
# for macOS, NSIS installers for Windows x64 and ARM64, an AppImage, a .deb and a Flatpak for
# Linux, each with its SHA-256. No signing certificates: see docs/RELEASE.md.
#
# A tag v<version> puts them on a draft release of that tag, beside the DMG of the macOS app;
# the release is published by hand. A change to the packaging builds them all, to see that they
# still build; so does running the workflow by hand.

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - .github/workflows/release.yml
      - apps/desktop/src-tauri/tauri*.conf.json
      - apps/desktop/packaging/**
      - scripts/desktop-release.sh
      - scripts/version.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust: aarch64-apple-darwin,x86_64-apple-darwin
            target: universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            rust: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - name: Windows ARM64
            os: windows-latest
            rust: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
          # The oldest Ubuntu runner: the binary runs on the systems with its glibc and newer.
          - name: Linux x86_64
            os: ubuntu-22.04
            rust: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: The tag is the version of every build
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(scripts/version.sh)" = "$GITHUB_REF_NAME"
      - name: WebKitGTK and AppImage tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/desktop/.nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
        working-directory: apps/desktop
      - name: Installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          # linuxdeploy is an AppImage itself; runners have no FUSE to mount it.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/desktop-release.sh
      - name: The Linux launchers pass the files opened with the app
        if: runner.os == 'Linux'
        working-directory: build/desktop
        run: |
          dpkg-deb --fsys-tarfile commaeditor_*_amd64.deb | tar -xO --wildcards './usr/share/applications/*.desktop' | tee deb.desktop
          grep -q '^Exec=commaeditor %F$' deb.desktop
          grep -q '^MimeType=.*text/csv' deb.desktop
          chmod +x CommaEditor-*.AppImage
          ./CommaEditor-*.AppImage --appimage-extract '*.desktop' > /dev/null
          cat squashfs-root/*.desktop
          grep -q '^Exec=commaeditor %F$' squashfs-root/*.desktop
          rm -rf deb.desktop squashfs-root
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: build/desktop/*
          if-no-files-found: error

  flatpak:
    name: Flatpak
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: linux
      - name: The .deb of this release
        id: deb
        run: |
          cp linux/commaeditor_*_amd64.deb apps/desktop/packaging/flatpak/commaeditor.deb
          echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: apps/desktop/packaging/flatpak/app.commaeditor.Desktop.yml
          bundle: CommaEditor-${{ steps.deb.outputs.version }}-linux-x86_64.flatpak
          upload-artifact: false
          cache: false
      - name: SHA-256
        run: |
          name=CommaEditor-${{ steps.deb.outputs.version }}-linux-x86_64.flatpak
          mkdir -p flatpak
          mv "$name" flatpak/
          cd flatpak && sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: flatpak/*
          if-no-files-found: error

  publish:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Upload to the release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The release of the macOS app may be there already; a new one starts as a draft.
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "CommaEditor ${GITHUB_REF_NAME#v}" --notes "See README for what is new."
          gh release upload "$GITHUB_REF_NAME" files/* --clobber
